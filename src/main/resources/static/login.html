<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ANNAM Smart Food Distribution</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="auth-page-wrapper">
    <div class="auth-card">
        <!-- Logo & Branding -->
        <div class="text-center mb-4">
            <div class="auth-brand-badge">
                <i class="bi bi-box2-heart"></i>
            </div>
            <h3 class="auth-title">ANNAM</h3>
            <p class="auth-subtitle">Smart Food Distribution and Food Waste Reduction</p>
        </div>

        <!-- Role Selector Tabs -->
        <div class="role-toggle-group" id="role-selector" role="tablist">
            <button type="button" class="role-toggle-btn active" id="btn-role-donor" data-role="DONOR">
                <i class="bi bi-heart-pulse"></i> Donor Login
            </button>
            <button type="button" class="role-toggle-btn" id="btn-role-admin" data-role="ADMIN">
                <i class="bi bi-shield-lock"></i> Admin Login
            </button>
        </div>

        <!-- Alert messages -->
        <div id="login-alert-container"></div>

        <!-- Login Form -->
        <form id="login-form" novalidate>
            <!-- Email -->
            <div class="mb-3">
                <label for="login-email" class="form-label small fw-bold text-dark">Email Address</label>
                <div class="input-icon-group">
                    <i class="bi bi-envelope input-icon-left"></i>
                    <input type="email" class="form-control" id="login-email" placeholder="name@example.com" required autocomplete="username">
                </div>
                <div class="invalid-feedback" id="email-feedback">Please enter a valid email address.</div>
            </div>

            <!-- Password with Show/Hide -->
            <div class="mb-3">
                <label for="login-password" class="form-label small fw-bold text-dark">Password</label>
                <div class="input-icon-group">
                    <i class="bi bi-lock input-icon-left"></i>
                    <input type="password" class="form-control" id="login-password" placeholder="Enter your password" required autocomplete="current-password">
                    <button type="button" class="password-toggle-btn" id="btn-toggle-password" title="Show/Hide Password" tabindex="-1">
                        <i class="bi bi-eye" id="password-eye-icon"></i>
                    </button>
                </div>
                <div class="invalid-feedback" id="password-feedback">Please enter your password.</div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn auth-btn-primary w-100 mt-2 d-flex align-items-center justify-content-center gap-2" id="btn-submit-login">
                <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                <span id="btn-login-text"><i class="bi bi-box-arrow-in-right"></i> Log In as Donor</span>
            </button>
        </form>

        <!-- Donor Registration Link -->
        <div class="text-center mt-4 pt-2 border-top">
            <p class="small text-muted mb-0" id="donor-register-prompt">
                New surplus food donor? 
                <a href="/register.html" class="fw-semibold text-success text-decoration-none">
                    Register your organization <i class="bi bi-arrow-right-short"></i>
                </a>
            </p>
        </div>

        <!-- Demo Credentials Helper (Viva Demonstration Assistance) -->
        <div class="demo-credentials-box">
            <div class="d-flex align-items-center justify-content-between mb-1">
                <span class="fw-bold"><i class="bi bi-info-circle-fill"></i> Project Demo Accounts</span>
                <span class="badge bg-success-subtle text-success">Quick Fill</span>
            </div>
            <div class="row g-1 mt-1 small">
                <div class="col-6">
                    <button type="button" class="btn btn-xs btn-outline-success w-100 py-1" onclick="quickFillCredentials('donor')" style="font-size: 0.72rem;">
                        <strong>Donor:</strong> <code>donor@annam.org</code>
                    </button>
                </div>
                <div class="col-6">
                    <button type="button" class="btn btn-xs btn-outline-success w-100 py-1" onclick="quickFillCredentials('admin')" style="font-size: 0.72rem;">
                        <strong>Admin:</strong> <code>admin@annam.org</code>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let selectedRole = 'DONOR';

    document.addEventListener('DOMContentLoaded', () => {
        initRoleSelector();
        initPasswordToggle();
        initFormHandler();
        checkUrlParams();
    });

    // ------------------------------------------------------------------------
    // Role Selector Tabs
    // ------------------------------------------------------------------------
    function initRoleSelector() {
        const btnDonor = document.getElementById('btn-role-donor');
        const btnAdmin = document.getElementById('btn-role-admin');
        const submitText = document.getElementById('btn-login-text');
        const registerPrompt = document.getElementById('donor-register-prompt');

        btnDonor.addEventListener('click', () => {
            selectedRole = 'DONOR';
            btnDonor.classList.add('active');
            btnDonor.classList.remove('admin-mode');
            btnAdmin.classList.remove('active', 'admin-mode');
            submitText.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Log In as Donor';
            registerPrompt.style.display = 'block';
        });

        btnAdmin.addEventListener('click', () => {
            selectedRole = 'ADMIN';
            btnAdmin.classList.add('active', 'admin-mode');
            btnDonor.classList.remove('active');
            submitText.innerHTML = '<i class="bi bi-shield-check"></i> Log In as Admin';
            registerPrompt.style.display = 'none';
        });
    }

    // ------------------------------------------------------------------------
    // Password Visibility Toggle
    // ------------------------------------------------------------------------
    function initPasswordToggle() {
        const toggleBtn = document.getElementById('btn-toggle-password');
        const passwordInput = document.getElementById('login-password');
        const eyeIcon = document.getElementById('password-eye-icon');

        toggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            eyeIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
        });
    }

    // ------------------------------------------------------------------------
    // Form Submit Handler
    // ------------------------------------------------------------------------
    function initFormHandler() {
        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('login-email');
        const passwordInput = document.getElementById('login-password');
        const submitBtn = document.getElementById('btn-submit-login');
        const spinner = document.getElementById('btn-spinner');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearAlert();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            let valid = true;
            if (!email || !email.includes('@')) {
                emailInput.classList.add('is-invalid');
                valid = false;
            } else {
                emailInput.classList.remove('is-invalid');
            }

            if (!password) {
                passwordInput.classList.add('is-invalid');
                valid = false;
            } else {
                passwordInput.classList.remove('is-invalid');
            }

            if (!valid) return;

            // Loading state
            submitBtn.disabled = true;
            spinner.classList.remove('d-none');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role: selectedRole })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showSuccessAlert('Authentication successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = data.redirectUrl || (selectedRole === 'ADMIN' ? '/index.html' : '/donor-dashboard.html');
                    }, 500);
                } else {
                    showErrorAlert(data.message || 'Invalid email or password.');
                    submitBtn.disabled = false;
                    spinner.classList.add('d-none');
                }
            } catch (err) {
                showErrorAlert('Unable to connect to server. Please ensure the backend is running.');
                submitBtn.disabled = false;
                spinner.classList.add('d-none');
            }
        });
    }

    function showErrorAlert(msg) {
        const container = document.getElementById('login-alert-container');
        container.innerHTML = `
            <div class="alert alert-danger py-2 px-3 small d-flex align-items-center gap-2 mb-3 fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
                <div class="flex-grow-1">${escapeHtml(msg)}</div>
                <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert"></button>
            </div>
        `;
    }

    function showSuccessAlert(msg) {
        const container = document.getElementById('login-alert-container');
        container.innerHTML = `
            <div class="alert alert-success py-2 px-3 small d-flex align-items-center gap-2 mb-3 fade show" role="alert">
                <i class="bi bi-check-circle-fill flex-shrink-0"></i>
                <div class="flex-grow-1">${escapeHtml(msg)}</div>
            </div>
        `;
    }

    function clearAlert() {
        document.getElementById('login-alert-container').innerHTML = '';
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.innerText = text;
        return div.innerHTML;
    }

    // Quick fill helper for presentation
    function quickFillCredentials(type) {
        const emailInput = document.getElementById('login-email');
        const passInput = document.getElementById('login-password');
        if (type === 'admin') {
            document.getElementById('btn-role-admin').click();
            emailInput.value = 'admin@annam.org';
            passInput.value = 'Admin@123';
        } else {
            document.getElementById('btn-role-donor').click();
            emailInput.value = 'donor@annam.org';
            passInput.value = 'Donor@123';
        }
        emailInput.classList.remove('is-invalid');
        passInput.classList.remove('is-invalid');
    }

    // Handle URL parameters (e.g. ?registered=true or ?message=logged_out or ?error=...)
    function checkUrlParams() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('registered') === 'true') {
            showSuccessAlert('Account registered successfully! Please log in with your credentials.');
            if (params.get('email')) {
                document.getElementById('login-email').value = params.get('email');
            }
        } else if (params.get('message') === 'logged_out') {
            showSuccessAlert('You have been safely logged out.');
        } else if (params.get('error') === 'session_expired') {
            showErrorAlert('Your session has expired. Please log in again.');
        } else if (params.get('error') === 'unauthorized_admin_access') {
            showErrorAlert('Access Denied: Donor accounts cannot access the Admin Dashboard.');
        }
    }
</script>

</body>
</html>
