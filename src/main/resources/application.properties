# ============================================================================
# Annam Food Distribution & Waste Reduction Application Configuration
# ============================================================================

spring.application.name=annam-food-distribution
server.port=8080

# MySQL DataSource configuration (XAMPP default: root user, no password, port 3306)
# Configurable via Environment variables: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:annam_food_distribution}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# SQL init mode (Managed through DatabaseInitConfig to ensure safe idempotency)
spring.sql.init.mode=never

# Jackson JSON settings for clean LocalTime and LocalDateTime output
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Spring Static Resources
spring.web.resources.static-locations=classpath:/static/

# Logging
logging.level.root=INFO
logging.level.com.annam=DEBUG
logging.level.org.springframework.jdbc=INFO

# Initial Admin & Authentication Settings (Configurable via ENV: ADMIN_EMAIL, ADMIN_PASSWORD)
annam.admin.email=${ADMIN_EMAIL:admin@annam.org}
annam.admin.password=${ADMIN_PASSWORD:Admin@123}
annam.admin.name=${ADMIN_NAME:Annam System Administrator}
annam.donor.sample-email=${SAMPLE_DONOR_EMAIL:donor@annam.org}
annam.donor.sample-password=${SAMPLE_DONOR_PASSWORD:Donor@123}
